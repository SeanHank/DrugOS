name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ""

jobs:
  # G1-G4 release quality gate + no-silent-fallback audit (doc/09).
  # A failing gate blocks build/release.
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R runtime + headers (required-R bridge)
        # The R bridge is a hard dependency (doc/06): the R-1 gate runs the
        # literature-PK estimator in R during G4. rpy2 3.6.x's CFFI CAPI-mode
        # bindings reference R_getVar, a symbol that only exists in R >= 4.6.0
        # (whose absence produced "symbol 'R_getVar' not found in libR.so"),
        # and rpy2 >= 3.6.7 requires R >= 4.5. Ubuntu's apt r-base on
        # ubuntu-latest is only R 4.3.x, so we install the current release
        # (>= 4.6) via the CRAN-backed r-lib/setup-r action instead.
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Assert R >= 4.5 for rpy2 (R_getVar requires >= 4.6)
        run: |
          python - <<'PY'
          import re, subprocess
          ver = subprocess.check_output(["R", "--version"], text=True)
          m = re.search(r"R version (\d+)\.(\d+)+", ver)
          assert m, "cannot parse R --version"
          v = tuple(map(int, m.groups()))
          assert v >= (4, 5), f"R {'.'.join(map(str, v))} too old: rpy2>=3.6 needs R>=4.5 and R_getVar needs R>=4.6"
          print("R OK:", ".".join(map(str, v)))
          PY
      - name: Build rpy2 against the CI R (avoid manylinux wheel mismatch)
        # rpy2's manylinux cp312 wheels are CFFI API-mode compiled against a
        # pinned R version and ship no working ABI fallback on Linux (macOS
        # wheels do, so local runs pass). A wheel/system-R binary mismatch
        # therefore only breaks CI. Compiling from source against the R
        # installed by setup-r removes that variable; the later
        # `pip install -e ".[dev]"` satisfies its `rpy2>=3.6`
        # requirement from this build.
        run: |
          R CMD config --version
          python -m pip install --no-cache-dir --no-binary=rpy2 "rpy2>=3.6"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify R bridge end-to-end (fail fast before the 20-min G3)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import numpy as np
          from drugos.rbridge import verify_pk
          t = np.linspace(0.0, 24.0, 25)
          c = 10.0 * np.exp(-0.1 * t)
          r = verify_pk(t, c, dose=100.0)
          assert r.is_finite(), "R bridge returned non-finite estimates"
          print("R bridge OK:", r.verdict, "agreement", r.agreement_frac)
          PY
      - name: Read version from pyproject.toml (authoritative for CI)
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run release quality gate + fallback audit
        # G3 runs with base pytest (--no-xdist): no pytest-xdist in CI.
        run: python scripts/release.py gates --no-xdist
      - name: Upload gate log and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            build/quality_gate.log
            validation/report.md

  # Build the sdist (.tar.gz) and wheel (.whl) only after the gates are green,
  # validate metadata, smoke-test the wheel in a clean env, and on tagged
  # pushes publish a GitHub Release with the artifacts attached. The release
  # version is read from pyproject.toml (never inferred from the tag or
  # hard-coded) and the tag must match it.
  build:
    name: build wheel + sdist
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Read version from pyproject.toml
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata (twine check)
        run: twine check dist/*
      - name: Smoke-test wheel in a clean env
        run: |
          python -m venv /tmp/drugos-wheel
          /tmp/drugos-wheel/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/drugos-wheel/bin/pip install --quiet flask numpy scipy pydantic rdkit
          /tmp/drugos-wheel/bin/python -c \
            "import importlib.resources as r; import drugos.version; \
             from drugos.web.app import create_app; create_app(); \
             assert r.files('drugos').joinpath('py.typed').is_file(); \
             print('wheel smoke OK', drugos.version.__version__)"
          /tmp/drugos-wheel/bin/drugos --version
          /tmp/drugos-wheel/bin/drugos benchmarks
        env:
          VERSION: ${{ env.VERSION }}
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub Release (tagged pushes, version from pyproject.toml)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          test "$VERSION" = "${GITHUB_REF_NAME#v}" || {
            echo "tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '$VERSION'"
            exit 1
          }
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DrugOS $VERSION" \
            --generate-notes