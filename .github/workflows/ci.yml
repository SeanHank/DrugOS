name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ""

jobs:
  # G1-G4 release quality gate + no-silent-fallback audit (doc/09).
  # A failing gate blocks build/release.
  quality:
    name: quality gate (G1-G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Read version from pyproject.toml (authoritative for CI)
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run release quality gate + fallback audit
        run: python scripts/release.py gates
      - name: Upload gate log and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            build/quality_gate.log
            validation/report.md

  # Build the sdist (.tar.gz) and wheel (.whl) only after the gates are green,
  # validate metadata, smoke-test the wheel in a clean env, and on tagged
  # pushes publish a GitHub Release with the artifacts attached. The release
  # version is read from pyproject.toml (never inferred from the tag or
  # hard-coded) and the tag must match it.
  build:
    name: build wheel + sdist
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Read version from pyproject.toml
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata (twine check)
        run: twine check dist/*
      - name: Smoke-test wheel in a clean env
        run: |
          python -m venv /tmp/drugos-wheel
          /tmp/drugos-wheel/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/drugos-wheel/bin/pip install --quiet flask numpy scipy pydantic rdkit
          /tmp/drugos-wheel/bin/python -c \
            "import importlib.resources as r; import drugos.version; \
             from drugos.web.app import create_app; create_app(); \
             assert r.files('drugos').joinpath('py.typed').is_file(); \
             print('wheel smoke OK', drugos.version.__version__)"
          /tmp/drugos-wheel/bin/drugos --version
          /tmp/drugos-wheel/bin/drugos benchmarks
        env:
          VERSION: ${{ env.VERSION }}
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub Release (tagged pushes, version from pyproject.toml)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          test "$VERSION" = "${GITHUB_REF_NAME#v}" || {
            echo "tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '$VERSION'"
            exit 1
          }
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DrugOS $VERSION" \
            --generate-notes